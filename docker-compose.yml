services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # one-shot job: run migrations (and optional demo data) once, before any web replica starts
  migrate:
    build: .
    env_file: .env
    command: >
      sh -c "python manage.py migrate --noinput &&
             if [ \"$$SEED_DEMO_DATA\" = \"true\" ]; then python manage.py seed_demo; fi"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # stateless API replicas; scale with: docker compose up -d --scale web=4
  web:
    build: .
    env_file: .env
    volumes:
      - media_data:/app/media
    deploy:
      replicas: 2
    depends_on:
      migrate:
        condition: service_completed_successfully

  # load balancer: round-robins across all `web` replicas
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

volumes:
  pg_data:
  media_data:
