# Docker's embedded DNS returns one A record per `web` replica.
# Using a variable in proxy_pass makes nginx re-resolve the name (every 5s), so scaling
# the web service up/down is picked up without restarting nginx.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;
    client_max_body_size 10m;

    location / {
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        # overwrite (not append) so clients cannot spoof their IP for rate limiting
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503;
    }
}
